# .github/workflows/friday_wrap.yml
#
# Friday Wrap (D14) — sends the week-in-review email every Friday at
# ~16:30 AEST (06:30 UTC Friday). New standalone workflow: it does not
# touch generate.yml or the daily briefing in any way.

name: Friday Wrap

on:
  schedule:
    - cron: "30 6 * * 5"        # 06:30 UTC Friday = 16:30 AEST Friday
  workflow_dispatch: {}

jobs:
  wrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # IMPORTANT: restore the token cache via Python json round-trip.
      # Piping the secret through bash `echo` strips newlines from the
      # multi-line JSON and breaks MSAL token parsing (learned the hard way).
      - name: Restore Outlook token cache
        env:
          OUTLOOK_TOKEN_CACHE: ${{ secrets.OUTLOOK_TOKEN_CACHE }}
        run: |
          python - <<'EOF'
          import json, os
          raw = os.environ["OUTLOOK_TOKEN_CACHE"]
          data = json.loads(raw)
          with open(".outlook_token_cache.bin", "w", encoding="utf-8") as f:
              json.dump(data, f)
          print("Token cache restored:", len(raw), "chars")
          EOF

      - name: Run Friday Wrap
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          OUTLOOK_CLIENT_ID:    ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_TENANT_ID:    ${{ secrets.OUTLOOK_TENANT_ID }}
          BRIEFING_EMAIL_TO:    ${{ secrets.BRIEFING_EMAIL_TO }}
          BRIEFING_EMAIL_GMAIL: ${{ secrets.BRIEFING_EMAIL_GMAIL }}
          CI: "true"
          GOOGLE_CAL_ICS_URL:   ${{ secrets.GOOGLE_CAL_ICS_URL }}
          # Where task_history.json is fetched back from, so "what slipped"
          # can compare against last Friday rather than guessing from age.
          BRIEFING_SITE_URL: "https://dmcalpine76-create.github.io/morning-briefing"
        run: python weekly_wrap.py

      # The rolling snapshot is published beside gas_history.json and read back
      # next Friday. keep_files matters: without it this deploy would wipe the
      # daily briefing's archive off gh-pages.
      - name: Publish the task snapshot
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  ./wrap_publish
          publish_branch: gh-pages
          keep_files: true
