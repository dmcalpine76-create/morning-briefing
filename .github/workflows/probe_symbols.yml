# Temporary. Yahoo Finance is unreachable from both the cloud workspace and the
# desktop VM, so symbol validation has to happen on the runner - the only place
# with production's network. Results are committed to a branch because the
# Actions log download goes to blob storage, which is also unreachable.
name: Probe market symbols

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade yfinance pandas
      - name: Probe
        run: python international_markets.py --probe > probe_result.txt 2>&1 || true
      - name: Publish result
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan symbol-probe
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f probe_result.txt
          git commit -m "symbol probe $(date -u +%FT%TZ)"
          git push -f origin symbol-probe
