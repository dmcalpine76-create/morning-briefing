name: Generate Morning Briefing

on:
  schedule:
    # 3:17 AM AEST (UTC+10) = 5:17 PM UTC (previous day)
    # Avoiding top-of-hour — GitHub drops queued jobs during peak load at :00
    # Runs Sunday–Thursday UTC = Monday–Friday AEST
    - cron: '17 17 * * 0-4'
    # D10 — second lightweight run: 8:15 AM AEST = 10:15 PM UTC (previous day)
    # Full regeneration (cheap on Haiku) so email/calendar/announcements refresh
    - cron: '15 22 * * 0-4'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run (optional)'
        required: false
        default: 'Manual trigger'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # ── 3. Dependencies ────────────────────────────────────────────────────
      # cryptography — AES encryption for wrap_password.py (B5)
      # edge-tts     — spoken MP3 briefing edition (D12)
      - name: Install dependencies
        run: |
          pip install \
            anthropic \
            feedparser \
            requests \
            msal \
            yfinance \
            python-dotenv \
            cryptography \
            edge-tts

      # ── 4. Restore Outlook token ───────────────────────────────────────────
      # Uses Python to write the token — bash echo corrupts multi-line JSON
      - name: Restore Outlook token
        env:
          OUTLOOK_TOKEN_CACHE: ${{ secrets.OUTLOOK_TOKEN_CACHE }}
        run: |
          python3 - <<'PYEOF'
          import os, json, sys
          raw = os.environ.get("OUTLOOK_TOKEN_CACHE", "")
          if not raw:
              print("WARNING: OUTLOOK_TOKEN_CACHE not set — Outlook features skipped")
              sys.exit(0)
          try:
              parsed = json.loads(raw)
              with open(".outlook_token_cache.bin", "w", encoding="utf-8") as f:
                  json.dump(parsed, f)
              print("OK: Outlook token cache restored")
          except json.JSONDecodeError:
              with open(".outlook_token_cache.bin", "w", encoding="utf-8") as f:
                  f.write(raw)
              print("OK: Outlook token cache restored (plain text format)")
          PYEOF

      # ── 5. (removed) Google token restore ─────────────────────────────────
      # Gmail/Google Calendar integration was fully removed (C2) —
      # gmail_email.py and google_calendar.py no longer exist and nothing
      # reads GOOGLE_TOKEN_CACHE or gmail_actions.json.

      # ── 6. Run briefing generator ──────────────────────────────────────────
      - name: Generate briefing
        env:
          CI: "true"
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          OUTLOOK_CLIENT_ID:    ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_TENANT_ID:    ${{ secrets.OUTLOOK_TENANT_ID }}
          BRIEFING_EMAIL_TO:    ${{ secrets.BRIEFING_EMAIL_TO }}
          BRIEFING_EMAIL_GMAIL: ${{ secrets.BRIEFING_EMAIL_GMAIL }}
          BRIEFING_PASSWORD:    ${{ secrets.BRIEFING_PASSWORD }}
	  AUDIO_VOICE: 		${{ secrets.AUDIO_VOICE }}
          # D3 — Outlook token expiry countdown (secret set by upload_tokens.py)
          OUTLOOK_TOKEN_SETUP_DATE: ${{ secrets.OUTLOOK_TOKEN_SETUP_DATE }}
          # D5/D13 — where gas_history.json / archive.json are fetched back from
          BRIEFING_SITE_URL: "https://dmcalpine76-create.github.io/morning-briefing"
        run: python briefing.py

      # ── 7. Wrap output + stage publish files ───────────────────────────────
      # Wraps the briefing (and the dated archive copy) with AES password
      # protection, stages the D5/D13 artifacts at the site root, then removes
      # the raw working folder so the UNWRAPPED briefing.html and the emailed
      # MP3 are never published. (Previously the timestamped subfolder — with
      # the unprotected briefing inside — was deployed to gh-pages.)
      - name: Wrap with password and stage publish files
        env:
          BRIEFING_PASSWORD: ${{ secrets.BRIEFING_PASSWORD }}
        run: |
          OUTPUT_DIR=$(ls -td output/*/ 2>/dev/null | head -1)
          if [ -z "$OUTPUT_DIR" ]; then
            echo "ERROR: No output folder found"
            exit 1
          fi
          echo "Output folder: $OUTPUT_DIR"

          # Main page — wrapped to index.html at the site root
          python wrap_password.py "${OUTPUT_DIR}briefing.html" "${OUTPUT_DIR}index.html" "$BRIEFING_PASSWORD"
          cp "${OUTPUT_DIR}index.html" output/index.html

          # D5 — rolling gas price history (sparkline source)
          cp "${OUTPUT_DIR}gas_history.json" output/ 2>/dev/null || true

          # D13 — archive manifest + index + today's dated copy (wrapped too)
          cp "${OUTPUT_DIR}archive.json" output/ 2>/dev/null || true
          cp "${OUTPUT_DIR}archive.html" output/ 2>/dev/null || true
          for f in "${OUTPUT_DIR}"briefing_*.html; do
            [ -e "$f" ] || continue
            python wrap_password.py "$f" "output/$(basename "$f")" "$BRIEFING_PASSWORD"
            echo "Wrapped archive copy: $(basename "$f")"
          done

          # Remove the raw working folder — contains the unwrapped briefing
          # and briefing.mp3 (emailed, not published)
          rm -rf "$OUTPUT_DIR"
          echo "Publish staging complete:"
          ls -la output/

      # ── 8. Deploy to GitHub Pages ──────────────────────────────────────────
      # keep_files (replacing force_orphan) preserves previous days' dated
      # archive copies on gh-pages — otherwise each deploy would wipe them
      # and the D13 archive index would link to missing pages.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  ./output
          publish_branch: gh-pages
          keep_files: true

      # ── 9. Notify briefing published (D11) ──────────────────────────────────
      # Requires an NTFY_TOPIC secret (your private ntfy.sh topic name).
      # Skips silently if the secret isn't set.
      - name: Notify briefing published
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set — skipping notification"
            exit 0
          fi
          curl -s \
            -H "Title: Morning Briefing ready" \
            -H "Tags: newspaper" \
            -H "Click: https://dmcalpine76-create.github.io/morning-briefing" \
            -d "Today's briefing is published." \
            "ntfy.sh/$NTFY_TOPIC"

      # ── 10. Alert on failure (D1) ────────────────────────────────────────────
      # Runs ONLY if any step above failed — a ping instead of silence at 5:30am.
      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set — skipping alert"
            exit 0
          fi
          curl -s \
            -H "Title: Morning Briefing FAILED" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "Run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "ntfy.sh/$NTFY_TOPIC"
